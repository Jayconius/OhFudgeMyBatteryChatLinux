name: Build Linux

# Builds entirely on GitHub's own Ubuntu runner - never touches a
# contributor's local machine. Runs on every push (so build breakage is
# caught immediately) and can be triggered manually; pushing a "v*" tag
# additionally publishes a prerelease with the built artifacts attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build main app
        run: pyinstaller OhFudgeMyBatteryChat.spec --noconfirm

      - name: Build Simulator
        run: pyinstaller OhFudgeMyBatteryChatSimulator.spec --noconfirm

      - name: Smoke test both binaries under Xvfb
        run: |
          set -e
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          export DISPLAY=:99

          test_binary() {
            local path="$1"
            "$path" &
            local pid=$!
            sleep 5
            if kill -0 "$pid" 2>/dev/null; then
              echo "$path: still running after 5s - OK"
              kill "$pid"
              wait "$pid" 2>/dev/null || true
            else
              echo "$path: exited within 5s - FAIL"
              exit 1
            fi
          }

          test_binary dist/OhFudgeMyBatteryChat
          test_binary dist/OhFudgeMyBatteryChatSimulator

      - name: Package tarball (both apps together, matching the Windows folder convention)
        run: |
          mkdir -p package
          cp dist/OhFudgeMyBatteryChat dist/OhFudgeMyBatteryChatSimulator package/
          chmod +x package/OhFudgeMyBatteryChat package/OhFudgeMyBatteryChatSimulator
          tar czf OhFudgeMyBatteryChatLinux-x86_64.tar.gz -C package .

      - name: Package AppImages
        run: |
          set -e
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          package_appimage() {
            local binname="$1"
            local appname="$2"
            rm -rf AppDir
            mkdir -p AppDir/usr/bin
            cp "dist/$binname" "AppDir/usr/bin/$binname"
            chmod +x "AppDir/usr/bin/$binname"
            cp assets/app_icon.png "AppDir/$binname.png"
            cat > "AppDir/$binname.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$appname
          Exec=$binname
          Icon=$binname
          Categories=Utility;
          Terminal=false
          EOF
            cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\$HERE/usr/bin/$binname" "\$@"
          EOF
            chmod +x AppDir/AppRun
            ./appimagetool --appimage-extract-and-run AppDir "dist/$binname-x86_64.AppImage"
            rm -rf AppDir
          }

          package_appimage OhFudgeMyBatteryChat "Oh Fudge, My Battery Chat"
          package_appimage OhFudgeMyBatteryChatSimulator "Oh Fudge - Battery Chat Simulator"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/OhFudgeMyBatteryChat-x86_64.AppImage
            dist/OhFudgeMyBatteryChatSimulator-x86_64.AppImage
            OhFudgeMyBatteryChatLinux-x86_64.tar.gz

      - name: Publish prerelease (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/OhFudgeMyBatteryChat-x86_64.AppImage" \
            "dist/OhFudgeMyBatteryChatSimulator-x86_64.AppImage" \
            "OhFudgeMyBatteryChatLinux-x86_64.tar.gz" \
            --title "${{ github.ref_name }}" \
            --prerelease \
            --notes "Beta Linux build. See the README for what's covered, known limitations, and how to report issues." \
            --repo "${{ github.repository }}"
